# CI Workflow — EShop Verse
#
# CI validates repository structure and runs the Android and Backend checks.
# The admin job is added when that component is initialized.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify repository structure
        run: |
          echo "Verifying repository structure..."
          test -f AGENTS.md       && echo "✓ AGENTS.md"
          test -f README.md       && echo "✓ README.md"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md"
          test -f LICENSE         && echo "✓ LICENSE"
          test -d android/        && echo "✓ android/"
          test -d backend/        && echo "✓ backend/"
          test -d admin/          && echo "✓ admin/"
          test -d docs/           && echo "✓ docs/"
          echo "Repository structure is valid."

  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Run Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eshopverse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, mysqli, zip
          coverage: none

      - name: Install Dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress

      - name: Create environment file
        working-directory: backend
        run: cp .env.example .env

      - name: Generate application key
        working-directory: backend
        run: php artisan key:generate

      - name: Validate and audit dependencies
        working-directory: backend
        run: |
          composer validate --strict
          composer audit

      - name: Style check
        working-directory: backend
        run: vendor/bin/pint --test

      # phpunit.xml hard-wires DB_DATABASE=eshopverse_test, so these tests
      # only ever touch the disposable service database above.
      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - name: Lint OpenAPI contract
        run: npx --yes "@redocly/cli@2.62.1" lint docs/openapi.yaml
